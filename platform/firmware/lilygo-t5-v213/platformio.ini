; LilyGO T5 2.13" e-paper — minimal hello + TF card detect
; Build: pio run -e lilygo-t5-v213
; Upload: pio run -e lilygo-t5-v213 -t upload
; Monitor: pio device monitor -b 115200

[env:lilygo-t5-v213]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    zinggjm/GxEPD2@^1.6.0
