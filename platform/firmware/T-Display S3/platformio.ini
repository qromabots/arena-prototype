; LilyGO T-Display S3 — 1.9" ST7789 8-bit parallel LCD (ESP32-S3R8)
; Build: pio run -e lilygo-t-display-s3
; Upload: pio run -e lilygo-t-display-s3 -t upload
; Monitor: pio device monitor -b 115200

[platformio]
boards_dir = boards
src_dir = lilygo-t-display-s3

[env:lilygo-t-display-s3]
platform = espressif32@6.5.0
board = lilygo-t-displays3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
