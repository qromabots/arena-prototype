# Deploy the TinyBase WsServer for cross-device drawing sync.
# After deploy, set the GitHub repo variable VITE_DRAWING_WS_ORIGIN to
# wss://<this-service-host>/ (Render provides HTTPS/WSS on the service URL).
services:
  - type: web
    name: arena-drawing-sync
    runtime: node
    rootDir: platform/drawing-sync
    buildCommand: npm install
    startCommand: npm start
